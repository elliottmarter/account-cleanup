services:
  account-cleanup:
    image: ghcr.io/elliottmarter/account-cleanup:latest
    # build: .                     # use this instead of image to build from source
    container_name: account-cleanup
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/London            # decides when the day rolls over
      # PUID: 1000                 # user/group the app runs as and owns /data
      # PGID: 1000
      APP_USERNAME: change-me      # required: login for the web UI;
      APP_PASSWORD: change-me      # the container won't start without both
      # Optional: sync from / delete in your Bitwarden vault (see README)
      # BW_CLIENTID: user.xxxxxxxx
      # BW_CLIENTSECRET: xxxxxxxx
      # BW_SERVER: https://vault.bitwarden.eu   # EU cloud or your Vaultwarden URL
      # BW_LOCK_MINUTES: 15
    volumes:
      - account-data:/data
    restart: unless-stopped

volumes:
  account-data:
